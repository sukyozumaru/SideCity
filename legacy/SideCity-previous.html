function newMissions(){let avail=missionTemplates.filter(m=>!state.missions.some(x=>x.id===m.id));while(state.missions.length<3&&avail.length){let m=avail.splice(Math.floor(Math.random()*avail.length),1)[0];state.missions.push({id:m.id,age:0})}}
function achievement(id,label){if(state.achievements.includes(id))return;state.achievements.push(id);state.gems++;notify('🏆 '+label+' · +1 💎')}
function checkProgress(){newMissions();for(let m of [...state.missions]){let t=missionTemplates.find(x=>x.id===m.id);if(t&&t.value()>=t.goal){state.money+=180;state.gems+=2;state.completed++;state.missions=state.missions.filter(x=>x!==m);notify('📋 ¡Misión completa! +180 💰 +2 💎');tone(700,.15);newMissions()}}
if(state.totalBuilt>=1)achievement('mayor','Alcalde de chiste');if(state.buildings.filter(b=>byId(b.id).cat==='farm').length>=3)achievement('farmer','Granjero urbano');if(cars.length>=5)achievement('traffic','Rey del tráfico');if(state.buildings.some(b=>b.id==='tower'||b.id==='office'))achievement('sky','Primer rascacielos');
let has=id=>state.buildings.some(b=>b.id===id);for(const [id,test,label] of [['bread',(has('wheat')||has('cows'))&&has('bakery'),'Pan artesanal'],['family',has('park')&&has('school'),'Barrio familiar']])if(test&&!state.discoveries.includes(id)){state.discoveries.push(id);state.money+=100;notify('✨ ¡DESCUBRIMIENTO! '+label+' · +100 💰')}
let next=levels[state.level+1];if(next&&resources.pop>=next[1]&&state.happy>=next[2]){state.level++;notify('🎊 ¡NUEVO DESBLOQUEADO! '+levels[state.level][0]);burst(cam.x+screen.w/cam.z/2,GROUND-250,45,['#f97c91','#ffd767','#8cdddf','#b59beb']);if(navigator.vibrate)navigator.vibrate([60,60,100]);showPanel('🎉 ¡Subiste de nivel!',`<p>Tu ciudad ahora es <b>${levels[state.level][0]}</b>. ¡Hay nuevos edificios disponibles!</p><button onclick="closePanel()">¡Genial!</button>`);renderItems()}}
function showMissions(){newMissions();showPanel('📋 Misiones',state.missions.map(m=>{let t=missionTemplates.find(x=>x.id===m.id);return `<p><b>${t.title}</b><br>${Math.min(t.goal,Math.floor(t.value()))} / ${t.goal} · +180 💰 +2 💎<br><small>Se renueva en ${Math.max(0,Math.ceil((240-m.age)/60))} min</small></p>`}).join('')+`<p>💎 ${state.gems} · Completadas: ${state.completed}</p><button onclick="closePanel()">Cerrar</button>`)}

function burst(x,y,n,colors){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-70,70),vy:rnd(-110,-20),life:rnd(.4,1.3),max:1.3,color:pick(colors),size:rnd(3,7)})}function floatText(x,y,text,color){texts.push({x,y,text,color,life:1.7})}
function notify(msg){$('banner').textContent=msg;$('banner').classList.add('show');bannerTimer=3.5}
function showPanel(title,body){$('panel').innerHTML='<h2>'+title+'</h2>'+body;$('overlay').style.display='grid'}function closePanel(){$('overlay').style.display='none'}

function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function emoji(s,x,y,size=20){ctx.font=size+'px system-ui';ctx.textAlign='center';ctx.fillText(s,x,y)}function bubble(s,x,y){ctx.font='bold 10px system-ui';let w=ctx.measureText(s).width+12;ctx.fillStyle='#fffef3';ctx.beginPath();ctx.moveTo(x-w/2+6,y-19);ctx.lineTo(x+w/2-6,y-19);ctx.quadraticCurveTo(x+w/2,y-19,x+w/2,y-13);ctx.lineTo(x+w/2,y-8);ctx.quadraticCurveTo(x+w/2,y-2,x+w/2-6,y-2);ctx.lineTo(x-w/2+6,y-2);ctx.quadraticCurveTo(x-w/2,y-2,x-w/2,y-8);ctx.lineTo(x-w/2,y-13);ctx.quadraticCurveTo(x-w/2,y-19,x-w/2+6,y-19);ctx.fill();ctx.fillStyle='#455367';ctx.textAlign='center';ctx.fillText(s,x,y-7)}
function drawSky(){let t=state.time%180,night=t>112||t<15;let grad=ctx.createLinearGradient(0,0,0,screen.h);let top=night?'#283a6a':t>90?'#f69e89':t<35?'#ffba94':'#78c9e8',bottom=night?'#796f9b':t>90?'#ffe2a7':'#d9f1db';grad.addColorStop(0,top);grad.addColorStop(1,bottom);rect(0,0,screen.w,screen.h,grad);if(night){for(let i=0;i<42;i++){let x=(i*137+30)%screen.w,y=(i*79+10)%(screen.h*.45);circle(x,y,1+Math.sin(elapsed+i)*.4,'#fff8cc')}}let sx=screen.w*((t%180)/180),sy=screen.h*.4-Math.sin(t/180*Math.PI)*screen.h*.3;circle(sx,sy,night?15:22,night?'#fff6d6':'#ffed9f');for(let i=0;i<5;i++){let x=(i*250+elapsed*3)% (screen.w+160)-80,y=70+i%3*35;ctx.globalAlpha=.55;circle(x,y,15,'white');circle(x+20,y-6,20,'white');circle(x+42,y,14,'white');ctx.globalAlpha=1}return night}

if(d.id==='wheat'){rect(0,-10,w,10,'#9f7350');for(let i=5;i<w;i+=9){let sway=Math.sin(elapsed*2+i)*3;rect(i,-22,2,17,'#9ca95e');circle(i+sway,-23-(Math.sin(elapsed/8)+1)*3,4,'#eaca6a')}ctx.restore();return}if(d.id==='park'){rect(0,-8,w,8,'#84bd74');emoji('🌳',20,-12,30);emoji('🌳',w-20,-12,31);emoji('⛲',w/2,-8,23);if(Math.random()<.04)burst(x+w/2,y-20,1,['#8dd8e8']);ctx.restore();return}if(d.id==='solar'){rect(4,-20,w-8,15,'#4c74a4');for(let i=12;i<w-5;i+=15)rect(i,-19,1,13,'#a8c7e1');rect(w/2-2,-5,4,5,'#637e78');ctx.restore();return}if(d.id==='wind'){rect(w/2-5,-h+16,10,h-16,'#e8e5d6');ctx.save();ctx.translate(w/2,-h+14);ctx.rotate(elapsed*1.6);for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);rect(-3,-31,6,30,'#f6f3df')}circle(0,0,5,'#e8a58d');ctx.restore();ctx.restore();return}
if(d.cat==='farm'&&d.id==='cows'){rect(0,-8,w,8,'#8dbd76');emoji('🐄',w/2+Math.sin(elapsed*.8)*12,-5,28);emoji('🐓',18,-5,17);if(Math.sin(elapsed*.5)>.95)bubble('¡Muu!',w/2,-32);ctx.restore();return}
let grad=ctx.createLinearGradient(0,-h,w,0);grad.addColorStop(0,d.color);grad.addColorStop(1,'#e8c6af');rect(2,-h,w-4,h,grad);rect(0,-h,w,5,'#63758a');rect(0,-5,w,5,'#667783');if(['cabin','house','bakery','barn','school','fire'].includes(d.id)){ctx.fillStyle='#cf8573';ctx.beginPath();ctx.moveTo(-3,-h);ctx.lineTo(w/2,-h-19);ctx.lineTo(w+3,-h);ctx.fill()}
if(d.id==='factory'||d.id==='plant'){rect(w*.7,-h-25,12,28,'#7e8693');if(Math.random()<.08)particles.push({x:x+w*.7+6,y:y-h-25,vx:rnd(-5,5),vy:-20,life:1.5,max:1.5,color:'#d9d8d0',size:rnd(5,10)})}
if(d.id==='water'){rect(w*.2,-h,w*.6,32,'#8cc6df');rect(w*.32,-h+32,5,h-32,'#7b8991');rect(w*.68,-h+32,5,h-32,'#7b8991')}
for(let yy=-h+14;yy< -20;yy+=24)for(let xx=10;xx<w-8;xx+=20){rect(xx,yy,11,14,night&&((xx+yy+b.x)%3)?'#ffe59a':'#a3d5de');rect(xx+5,yy,1,14,'#fff9d6');if(Math.sin(elapsed*.7+xx+yy+b.x)>.92)circle(xx+5,yy+9,2,'#725c69')}
rect(w/2-7,-18,14,18,'#8d6c67');if(d.id==='hospital')emoji('✚',w/2,-h+22,22);if(d.id==='busstop')emoji('🚏',w/2,-h+24,22);if(d.cat==='farm')emoji('🚜',w/2+Math.sin(elapsed)*20,-3,20);if(d.id==='tower'&&Math.sin(elapsed*.2+b.x)>.9)emoji('🐈',w-10,-h-4,15);
if((resources.e<0&&d.e>0)||(resources.water<0&&d.water>0)||(resources.food<0&&d.food>0)){let warning=resources.e<0&&d.e>0?'⚡':resources.water<0&&d.water>0?'💧':'🌾';emoji(warning+'❌',w/2,-h-12+Math.sin(elapsed*3)*3,15)}ctx.restore()}
function drawPerson(p){let jump=p.jump>0?Math.sin((1-p.jump/.6)*Math.PI)*18:0,x=p.x,y=GROUND-10-jump;circle(x,y-12,4,'#eab694');rect(x-4,y-8,8,10,p.color);ctx.strokeStyle='#47566b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-2,y+2);ctx.lineTo(x-4+Math.sin(elapsed*9+p.x)*3,y+8);ctx.moveTo(x+2,y+2);ctx.lineTo(x+4-Math.sin(elapsed*9+p.x)*3,y+8);ctx.stroke();if(p.bubble>0)bubble(p.name+': '+p.msg,x,y-19)}
function render(){ctx.setTransform(screen.dpr,0,0,screen.dpr,0,0);let night=drawSky();ctx.save();ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);rect(0,GROUND,WORLD,400,'#bb8c68');rect(0,GROUND,WORLD,14,'#83bd72');for(let i=0;i<WORLD;i+=120){ctx.strokeStyle='#a6785d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(i,GROUND+50);ctx.lineTo(i+30,GROUND+95);ctx.lineTo(i+50,GROUND+65);ctx.stroke()}rect(0,GROUND+125,WORLD,8,'#79b6c6');rect(0,GROUND+245,WORLD,6,'#7d7881');for(let b of state.buildings.filter(b=>groundType(byId(b.id))))drawBuilding(b,night);for(let b of state.buildings.filter(b=>!groundType(byId(b.id))))drawBuilding(b,night);for(let c of cars){let y=GROUND+1;rect(c.x-16,y-13,c.bus?40:32,12,c.bus?'#f2c35e':c.color);circle(c.x-9,y,4,'#394759');circle(c.x+10,y,4,'#394759');if(night)circle(c.x+(c.v>0?16:-16),y-9,3,'#fff1a0');if(c.bubble>0)bubble(c.msg,c.x,y-24)}for(let p of people)drawPerson(p);for(let i=0;i<4;i++)emoji('🐦',(elapsed*18+i*280)%WORLD,140+i*17,14);if(people.length>2)emoji('🐕',people[0].x-16,GROUND-2,16);if(event){let ex=cam.x+screen.w/cam.z*.5,ey=cam.y+160;if(event.type==='ufo')emoji('🛸',ex+Math.sin(elapsed)*80,ey,45);if(event.type==='heli')emoji('🚁',ex+Math.sin(elapsed)*100,ey,40);if(event.type==='rainbow')emoji('🌈',ex,ey+70,80);if(event.type==='balloons'||event.type==='festival')for(let i=0;i<8;i++)emoji('🎈',ex+(i-4)*30,ey+Math.sin(elapsed+i)*10,24);if(event.type==='ice')emoji('🍦',ex,GROUND-30,40);if(event.type==='cat')emoji('🐈',ex,GROUND-150,28);if(event.type==='rain')for(let i=0;i<60;i++){let x=cam.x+((i*91+elapsed*180)%(screen.w/cam.z+100));let y=cam.y+((i*71+elapsed*250)%(screen.h/cam.z));rect(x,y,2,12,'#b4e7ef')}}if(ghost&&selected){let d=byId(selected),p=placement(d,ghost.x);ctx.globalAlpha=.35;rect(p.x,p.y-Math.max(d.h,16),d.w,Math.max(d.h,16),p.ok?'#52ee8a':'#ff4d55');ctx.globalAlpha=1}for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);circle(p.x,p.y,p.size,p.color)}ctx.globalAlpha=1;for(let t of texts){ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y)}ctx.restore()}

let pointers=new Map(),gesture=null,longTimer=0,lastPinch=0;
C.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){gesture={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false,long:false};let p=world(e.clientX,e.clientY),b=hitBuilding(p.x,p.y);if(b&&!selected)longTimer=setTimeout(()=>{if(gesture&&!gesture.moved&&pointers.size===1){gesture.long=true;contextMenu(b)}},600)}else if(pointers.size===2){clearTimeout(longTimer);let a=[...pointers.values()];lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(gesture)gesture.moved=true}});
C.addEventListener('pointermove',e=>{let old=pointers.get(e.pointerId);ghost=world(e.clientX,e.clientY);if(!old)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;if(lastPinch)zoomAt(cam.z*dist/lastPinch,cx,cy);lastPinch=dist;return}if(gesture){if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>8){gesture.moved=true;clearTimeout(longTimer)}if(gesture.moved){cam.x-=(e.clientX-gesture.lastX)/cam.z;cam.y-=(e.clientY-gesture.lastY)/cam.z;clampCam()}gesture.lastX=e.clientX;gesture.lastY=e.clientY}});
function endPointer(e){clearTimeout(longTimer);if(pointers.size===1&&gesture&&!gesture.moved&&!gesture.long){let p=world(e.clientX,e.clientY);if(selected)place(p.x);else{let human=people.find(q=>Math.abs(q.x-p.x)<12&&Math.abs(GROUND-18-p.y)<25);if(human){human.jump=.6;human.bubble=2;human.msg=pick(phrases);state.money+=3;floatText(human.x,GROUND-35,pick(['+3 💰','❤️ +3 💰']),'#eaa652');tone(620,.08);updateUI()}else{let b=hitBuilding(p.x,p.y);if(b)interact(b)}}}pointers.delete(e.pointerId);if(!pointers.size)gesture=null;lastPinch=0}C.addEventListener('pointerup',endPointer);C.addEventListener('pointercancel',e=>{clearTimeout(longTimer);pointers.delete(e.pointerId);gesture=null});C.addEventListener('wheel',e=>{e.preventDefault();zoomAt(cam.z*Math.exp(-e.deltaY*.001),e.clientX,e.clientY)},{passive:false});C.addEventListener('contextmenu',e=>{e.preventDefault();let p=world(e.clientX,e.clientY),b=hitBuilding(p.x,p.y);if(b)contextMenu(b)});
$('cancel').onclick=()=>{selected=null;renderItems();updateUI()};$('sound').onclick=()=>{muted=!muted;$('sound').innerHTML=uiIcon(muted?'muted':'sound');if(!muted)tone(500,.08)};$('pause').onclick=()=>{paused=!paused;$('pause').innerHTML=uiIcon(paused?'play':'pause')};$('missions').onclick=showMissions;$('achievements').onclick=()=>showPanel('🏆 Logros',`<p>${state.achievements.length?state.achievements.map(id=>({mayor:'🤡 Alcalde de chiste',farmer:'🌾 Granjero urbano',traffic:'🚗 Rey del tráfico',sky:'🏙️ Primer rascacielos'})[id]).join('<br>'):'Aún no hay logros. ¡Construye tu ciudad!'}</p><p>Descubrimientos: ${state.discoveries.join(', ')||'ninguno'}</p><button onclick="closePanel()">Cerrar</button>`);$('chaos').onclick=()=>{if(state.level<2)return notify('Modo caos se desbloquea en Villa');state.chaos=60;eventTimer=.1;notify('🌀 ¡Modo caos durante 1 minuto!')};$('sandbox').onclick=()=>{if(state.level<3)return notify('Sandbox se desbloquea en Ciudad');state.sandbox=!state.sandbox;notify(state.sandbox?'🏖️ Sandbox activado: construcción gratis':'🏖️ Sandbox desactivado')};$('help').onclick=()=>showPanel('🏙️ Cómo jugar','<p>Elige una construcción y toca el terreno. Arrastra para explorar y usa la rueda o dos dedos para acercar. Mantén pulsado un edificio para mejorarlo o demolerlo.</p><p>Construye granjas, energía y agua para mantener felices a tus habitantes. Las carreteras contiguas permiten que circulen vehículos. Cumple misiones y aumenta población y felicidad para desbloquear novedades.</p><button onclick="closePanel()">¡Entendido!</button>');
// 13. Sonido generado con WebAudio
let audioCtx;function tone(freq,duration,type='sine',delay=0){if(muted)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.01)}catch(e){}}
// 14. Guardado y carga
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.buildings)){Object.assign(state,s);state.buildings=state.buildings.filter(b=>byId(b.id)&&Number.isFinite(b.x)&&Number.isFinite(b.y));state.missions=Array.isArray(state.missions)?state.missions.filter(m=>missionTemplates.some(t=>t.id===m.id)):[]}}catch(e){}let now=new Date(),today=now.getFullYear()+'-'+now.getMonth()+'-'+now.getDate();if(state.day!==today){let previous=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1),yesterday=previous.getFullYear()+'-'+previous.getMonth()+'-'+previous.getDate();state.streak=state.day===yesterday?state.streak+1:1;state.day=today;let reward=50+Math.min(state.streak,7)*20;state.money+=reward;setTimeout(()=>notify('📅 Racha de '+state.streak+' días · +'+reward+' 💰'),1200)}calculate();refreshEntities();newMissions()}
// 15. Loop principal con delta time y límite de trabajo
let last=0;function loop(ts){let dt=Math.min((ts-last)/1000||0,.05);last=ts;if(!paused){elapsed+=dt;state.time=(state.time+dt)%180;acc+=dt;saveTimer+=dt;comboTimer=Math.max(0,comboTimer-dt);if(bannerTimer>0&&(bannerTimer-=dt)<=0)$('banner').classList.remove('show');if(state.chaos>0)state.chaos=Math.max(0,state.chaos-dt);eventTimer-=dt;if(eventTimer<=0){startEvent();eventTimer=state.chaos>0?5:rnd(20,40)}if(event&&(event.left-=dt)<=0)event=null;for(let m of [...state.missions]){m.age+=dt;if(m.age>=240){state.missions=state.missions.filter(v=>v!==m);newMissions()}}while(acc>=1){acc--;tick()}if(saveTimer>=10){saveTimer=0;save()}for(let b of state.buildings)b.bounce=Math.max(0,(b.bounce||0)-dt*2);updateEntities(dt);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.life-=dt}particles=particles.filter(p=>p.life>0).slice(-300);for(let t of texts){t.y-=25*dt;t.life-=dt}texts=texts.filter(t=>t.life>0)}render();requestAnimationFrame(loop)}
window.addEventListener('resize',resize);window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});document.querySelectorAll('[data-icon]').forEach(function(el){el.innerHTML=uiIcon(el.getAttribute('data-icon'))});['sound','pause','missions','achievements','sandbox','help'].forEach(function(id){$(id).innerHTML=uiIcon(id)});resize();load();renderCats();renderItems();updateTutorial();updateUI();clearTimeout(inicioSideCity);requestAnimationFrame(loop);
</script></body></html>
